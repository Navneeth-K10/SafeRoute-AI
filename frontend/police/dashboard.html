<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeRoute - Police Dashboard</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          },
          colors: {
            cyber: {
              dark: '#0a0e17',
              card: 'rgba(15, 23, 42, 0.75)',
              cyan: '#00f0ff',
              blue: '#0284c7',
              emerald: '#10b981',
              amber: '#f59e0b',
              rose: '#ef4444'
            }
          }
        }
      }
    }
  </script>
  
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-cyber-dark text-slate-100 min-h-screen flex flex-col bg-grid antialiased select-none">

  <!-- Header -->
  <header class="sticky top-0 z-50 glass-panel rounded-none border-x-0 border-t-0 px-4 py-2.5 backdrop-blur-xl">
    <div class="max-w-[1920px] mx-auto flex flex-wrap items-center justify-between gap-3">
      <!-- Brand -->
      <div class="flex items-center gap-3">
        <div class="relative w-9 h-9 rounded-xl bg-gradient-to-br from-blue-600 to-indigo-800 flex items-center justify-center shadow-lg shadow-blue-500/30">
          <span class="text-lg font-black text-white">SR</span>
        </div>
        <div>
          <h1 class="font-black text-base tracking-wide bg-gradient-to-r from-white via-blue-200 to-blue-400 bg-clip-text text-transparent">
            SafeRoute <span class="text-blue-400 text-xs font-mono font-normal">POLICE DASHBOARD</span>
          </h1>
        </div>
      </div>
      
      <!-- User Profile -->
      <div class="flex items-center gap-2.5">
        <div class="flex items-center gap-2 bg-slate-800/80 px-2.5 py-1 rounded-lg border border-slate-700">
          <div class="w-6 h-6 rounded-full bg-gradient-to-tr from-blue-400 to-indigo-600 flex items-center justify-center text-xs font-bold text-white" id="userInitial">
            P
          </div>
          <div class="text-left hidden sm:block">
            <div class="text-xs font-bold leading-tight" id="currentUserName">Loading...</div>
            <div class="text-[10px] text-blue-400 font-mono leading-tight">POLICE</div>
          </div>
        </div>
        
        <button id="logoutBtn" class="btn-cyber-danger text-xs py-1.5 px-3 flex items-center gap-1 shadow-md shadow-rose-900/50 hover:bg-rose-600">
          LOGOUT
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-7xl mx-auto w-full p-4 flex flex-col gap-4 mt-4">
    <div class="glass-panel p-5 flex flex-col gap-4 border border-blue-500/30 flex-1 min-h-[600px]">
      <div class="flex justify-between items-center border-b border-slate-800 pb-4">
        <div>
          <h2 class="font-extrabold text-2xl text-blue-400">PENDING ACCIDENT REPORTS</h2>
          <p class="text-sm text-slate-400">Review and verify user-submitted accident reports.</p>
        </div>
        <button id="refreshReportsBtn" class="btn-cyber-primary !bg-blue-600 hover:!bg-blue-500 !border-blue-400 px-4 py-2 rounded-lg font-bold text-xs tracking-wide shadow-lg shadow-blue-900/50 flex items-center gap-2 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.59-9.5l5.8 5.8"/></svg>
          Refresh Feed
        </button>
      </div>
      
      <div id="pendingReportsList" class="flex flex-col gap-6 overflow-y-auto pr-2 custom-scrollbar content-start">
        <!-- Loading state -->
        <div class="text-center p-8 text-sm text-slate-400 animate-pulse">Loading pending reports...</div>
      </div>
    </div>
  </main>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/policeDashboard.js"></script>
</body>
</html>
