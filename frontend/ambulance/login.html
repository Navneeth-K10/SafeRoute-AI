<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeRoute - Ambulance Login</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          },
          colors: {
            cyber: {
              dark: '#0a0e17',
              card: 'rgba(15, 23, 42, 0.75)',
              cyan: '#00f0ff',
              blue: '#0284c7',
              emerald: '#10b981',
              amber: '#f59e0b',
              rose: '#ef4444'
            }
          }
        }
      }
    }
  </script>
  
  <link rel="stylesheet" href="../css/style.css">
  
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .auth-card {
      width: 100%;
      max-width: 400px;
    }
  </style>
</head>
<body class="bg-cyber-dark text-slate-100 bg-grid antialiased select-none">
  
  <div class="login-container">
    <div class="glass-panel auth-card p-8 rounded-2xl relative overflow-hidden shadow-2xl border border-rose-500/30">
      <!-- Glow effect -->
      <div class="absolute -top-20 -left-20 w-40 h-40 bg-rose-500 rounded-full blur-[80px] opacity-20"></div>
      
      <div class="text-center mb-6">
        <h1 class="font-black text-2xl tracking-wide bg-gradient-to-r from-white via-rose-200 to-rose-400 bg-clip-text text-transparent mb-1">
          SafeRoute
        </h1>
        <p class="text-sm text-rose-400 font-mono">AMBULANCE LOGIN</p>
      </div>

      <div id="message-area" class="hidden mb-4 p-3 rounded-lg text-sm font-medium text-center">
      </div>

      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-xs font-mono text-slate-400 mb-1.5 ml-1">OFFICIAL EMAIL</label>
          <input type="email" id="email" required 
            class="w-full bg-slate-900/50 border border-slate-700 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-rose-500 focus:ring-1 focus:ring-rose-500 transition-colors text-white placeholder-slate-500" 
            placeholder="ambulance@hospital.org">
        </div>

        <div>
          <label class="block text-xs font-mono text-slate-400 mb-1.5 ml-1">PASSWORD</label>
          <input type="password" id="password" required 
            class="w-full bg-slate-900/50 border border-slate-700 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-rose-500 focus:ring-1 focus:ring-rose-500 transition-colors text-white placeholder-slate-500" 
            placeholder="••••••••">
        </div>

        <button type="submit" id="login-btn" class="w-full btn-cyber-danger !bg-rose-600 hover:!bg-rose-500 !border-rose-400 shadow-rose-900/50 py-3.5 rounded-lg font-bold tracking-wide mt-6 relative overflow-hidden group">
          <span class="relative z-10 flex items-center justify-center gap-2">
            SECURE LOGIN
          </span>
        </button>
      </form>

      <div class="mt-8 flex flex-col gap-2 text-center text-sm text-slate-400">
        <div>
          Not registered? 
          <a href="register.html" class="text-rose-400 hover:text-rose-300 font-medium transition-colors">Register Ambulance</a>
        </div>
        <div class="pt-3 border-t border-slate-800">
          <a href="../login.html" class="text-slate-500 hover:text-slate-300 transition-colors text-xs">Back to Citizen Login</a>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btn = document.getElementById('login-btn');
      const msgArea = document.getElementById('message-area');
      
      btn.disabled = true;
      btn.innerHTML = '<span class="relative z-10">AUTHENTICATING...</span>';
      msgArea.classList.add('hidden');
      
      try {
        const res = await auth.login(email, password);
        
        if (!res.ok) {
          msgArea.textContent = res.data.message || 'Login failed';
          msgArea.className = 'mb-4 p-3 rounded-lg bg-rose-500/10 border border-rose-500/30 text-rose-400 text-sm font-medium text-center';
          msgArea.classList.remove('hidden');
          btn.disabled = false;
          btn.innerHTML = '<span class="relative z-10">SECURE LOGIN</span>';
        }
        // If successful, auth.js automatically handles redirection in redirectBasedOnRole
      } catch (err) {
        msgArea.textContent = 'Server connection error';
        msgArea.className = 'mb-4 p-3 rounded-lg bg-rose-500/10 border border-rose-500/30 text-rose-400 text-sm font-medium text-center';
        msgArea.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = '<span class="relative z-10">SECURE LOGIN</span>';
      }
    });
  </script>
</body>
</html>
