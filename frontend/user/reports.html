<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeRoute - My Reports</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          },
          colors: {
            cyber: {
              dark: '#0a0e17',
              card: 'rgba(15, 23, 42, 0.75)',
              cyan: '#00f0ff',
              blue: '#0284c7',
              emerald: '#10b981',
              amber: '#f59e0b',
              rose: '#ef4444'
            }
          }
        }
      }
    }
  </script>
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-cyber-dark text-slate-100 min-h-screen flex flex-col bg-grid antialiased select-none">

  <!-- Header -->
  <header class="sticky top-0 z-50 glass-panel rounded-none border-x-0 border-t-0 px-4 py-2.5 backdrop-blur-xl">
    <div class="max-w-[1920px] mx-auto flex flex-wrap items-center justify-between gap-3">
      <!-- Brand & Radar -->
      <div class="flex items-center gap-3">
        <div class="relative w-9 h-9 rounded-xl bg-gradient-to-br from-cyan-500 to-blue-600 flex items-center justify-center shadow-lg shadow-cyan-500/30">
          <span class="text-lg font-black text-white">SR</span>
        </div>
        <div>
          <h1 class="font-black text-base tracking-wide bg-gradient-to-r from-white via-cyan-200 to-cyan-400 bg-clip-text text-transparent">
            SafeRoute <span class="text-cyan-400 text-xs font-mono font-normal">MY REPORTS</span>
          </h1>
        </div>
      </div>
      
      <!-- User Profile -->
      <div class="flex items-center gap-2.5">
        <div class="flex items-center gap-2 bg-slate-800/80 px-2.5 py-1 rounded-lg border border-slate-700">
          <div class="w-6 h-6 rounded-full bg-gradient-to-tr from-cyan-400 to-blue-500 flex items-center justify-center text-xs font-bold text-slate-900" id="userInitial">
            U
          </div>
          <div class="text-left hidden sm:block">
            <div class="text-xs font-bold leading-tight" id="currentUserName">Loading...</div>
            <div class="text-[10px] text-cyan-400 font-mono leading-tight">USER</div>
          </div>
        </div>
        
        <a href="dashboard.html" class="btn-cyber-secondary text-xs py-1.5 px-3 flex items-center gap-1 shadow-md shadow-slate-900/50 hover:bg-slate-800 border-slate-700 text-slate-300 transition-colors">
          BACK TO DASHBOARD
        </a>
        
        <button id="logoutBtn" class="btn-cyber-danger text-xs py-1.5 px-3 flex items-center gap-1 shadow-md shadow-rose-900/50 hover:bg-rose-600">
          LOGOUT
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-4xl mx-auto w-full p-4 flex flex-col gap-4 mt-4">
    <!-- My Reports History Section -->
    <div class="glass-panel p-5 flex flex-col gap-4 border border-cyan-500/30 flex-1 min-h-[600px] overflow-hidden">
      <div class="flex justify-between items-center border-b border-slate-800 pb-4">
        <div>
          <h2 class="font-extrabold text-2xl text-cyan-300">My Reports</h2>
          <p class="text-sm text-slate-400">History of your submitted accidents.</p>
        </div>
        <button id="refreshReportsBtn" class="btn-cyber-primary px-4 py-2 rounded-lg font-bold text-xs tracking-wide shadow-lg shadow-cyan-900/50 flex items-center gap-2 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.59-9.5l5.8 5.8"/></svg>
          Refresh Reports
        </button>
      </div>
      
      <div id="myReportsList" class="grid grid-cols-1 md:grid-cols-2 gap-4 overflow-y-auto pr-2 custom-scrollbar h-full content-start">
        <!-- Loading state -->
        <div class="col-span-full text-center p-8 text-sm text-slate-400 animate-pulse">Loading reports...</div>
      </div>
    </div>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/accidentHistory.js"></script>
  <script src="../js/userReports.js"></script>
</body>
</html>
