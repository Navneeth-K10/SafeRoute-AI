<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeRoute - Login</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          },
          colors: {
            cyber: {
              dark: '#0a0e17',
              card: 'rgba(15, 23, 42, 0.75)',
              cyan: '#00f0ff',
              blue: '#0284c7',
              emerald: '#10b981',
              amber: '#f59e0b',
              rose: '#ef4444'
            }
          }
        }
      }
    }
  </script>
  
  <link rel="stylesheet" href="css/style.css">
  
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
    }
  </style>
</head>
<body class="bg-cyber-dark text-slate-100 bg-grid antialiased select-none">
  
  <div class="login-container">
    <div class="glass-panel auth-card p-8 rounded-2xl relative overflow-hidden shadow-2xl">
      <!-- Glow effect -->
      <div class="absolute -top-20 -right-20 w-40 h-40 bg-cyan-500 rounded-full blur-[80px] opacity-20"></div>
      
      <div class="text-center mb-8">
        <div class="mx-auto w-16 h-16 rounded-xl bg-gradient-to-br from-cyan-500 to-blue-600 flex items-center justify-center shadow-lg shadow-cyan-500/30 mb-4">
          <span class="text-3xl font-black text-white">SR</span>
        </div>
        <h1 class="font-black text-2xl tracking-wide bg-gradient-to-r from-white via-cyan-200 to-cyan-400 bg-clip-text text-transparent mb-1">
          SafeRoute
        </h1>
        <p class="text-sm text-cyan-400 font-mono">SECURE ACCESS</p>
      </div>

      <div id="error-message" class="hidden mb-4 p-3 rounded-lg bg-rose-500/10 border border-rose-500/30 text-rose-400 text-sm font-medium text-center">
      </div>

      <form id="login-form" class="space-y-5">
        <div>
          <label class="block text-xs font-mono text-slate-400 mb-1.5 ml-1">EMAIL ADDRESS</label>
          <input type="email" id="email" required 
            class="w-full bg-slate-900/50 border border-slate-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-colors text-white placeholder-slate-500" 
            placeholder="Enter your email">
        </div>
        
        <div>
          <label class="block text-xs font-mono text-slate-400 mb-1.5 ml-1">PASSWORD</label>
          <input type="password" id="password" required 
            class="w-full bg-slate-900/50 border border-slate-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-colors text-white placeholder-slate-500" 
            placeholder="Enter your password">
        </div>

        <button type="submit" id="login-btn" class="w-full btn-cyber-primary py-3 rounded-lg font-bold tracking-wide mt-2 relative overflow-hidden group">
          <span class="relative z-10 flex items-center justify-center gap-2">
            LOGIN
          </span>
          <div class="absolute inset-0 h-full w-full bg-gradient-to-r from-cyan-400 to-blue-500 opacity-0 group-hover:opacity-20 transition-opacity"></div>
        </button>
      </form>

      <div class="mt-6 text-center text-sm text-slate-400">
        Don't have an account? 
        <a href="account-type.html" class="text-cyan-400 hover:text-cyan-300 font-medium transition-colors">Register</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btn = document.getElementById('login-btn');
      const errorDiv = document.getElementById('error-message');
      
      btn.disabled = true;
      btn.innerHTML = '<span class="relative z-10 flex items-center justify-center gap-2">AUTHENTICATING...</span>';
      errorDiv.classList.add('hidden');
      
      try {
        const res = await auth.login(email, password);
        if (!res.ok) {
          errorDiv.textContent = res.data.message || 'Login failed';
          errorDiv.classList.remove('hidden');
          btn.disabled = false;
          btn.innerHTML = '<span class="relative z-10 flex items-center justify-center gap-2">LOGIN</span>';
        }
        // If successful, auth.js handles the redirect based on role
      } catch (err) {
        errorDiv.textContent = 'Server connection error';
        errorDiv.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = '<span class="relative z-10 flex items-center justify-center gap-2">LOGIN</span>';
      }
    });
  </script>
</body>
</html>
